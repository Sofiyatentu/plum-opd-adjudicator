version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: plum_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plum_admin
      POSTGRES_PASSWORD: plum_secret_dev
      POSTGRES_DB: plum_opd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plum_admin -d plum_opd"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plum_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://plum_admin:plum_secret_dev@db:5432/plum_opd
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TESSERACT_PATH: /usr/bin/tesseract
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - ./policy_terms.json:/app/policy_terms.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plum_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
